[project]
name = "document-copilot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "openai>=3.28.0",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.0",
    "pydantic-ai>=2.55.0",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.1.4",
    "structlog>=26.1.0",
    "supabase>=2.32.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: requires network, live database, or live API credentials",
]

[tool.ruff]
target-version = "py312"
src = ["app", "ingest", "tests", "alembic"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["app", "ingest"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501", "UP"]
